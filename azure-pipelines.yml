trigger:
  batch: true
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md
      - azure-pipelines.yml

pr:
  autoCancel: true
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md

jobs:
- job: Deploy
  displayName: Deploy to Salesforce Dev Org
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - task: UseNode@1
    displayName: Use Node.js
    inputs:
      version: '16.x'

  - bash: |
      npm install sfdx-cli --global
    displayName: Install Salesforce CLI

  - bash: |
      sfdx force:auth:jwt:grant \
        --clientid $(salesforceDevOrgClientId) \
        --jwtkeyfile ./buildfiles/server.key \
        --username $(salesforceDevOrgUserName) \
        --instanceurl $(salesforceDevOrgInstanceURL) \
        --setalias devOrg \
        --setdefaultusername
    displayName: Authorize Salesforce Org

  - bash: |
      sfdx force:source:convert -r ./force-app -d ./toDeploy
    displayName: Convert Source to Metadata API Format

  - bash: |
      sfdx force:mdapi:deploy \
        -d ./toDeploy \
        -u devOrg \
        -l RunLocalTests \
        -c \
        -w 10
    displayName: Validate Deployment (Check Only)

  - bash: |
      sfdx force:mdapi:deploy \
        -d ./toDeploy \
        -u devOrg \
        -l RunLocalTests \
        -w 10
    displayName: Deploy Source Code to Dev Org